    <style>
        /* CSS: Aqui definimos a aparência da página */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        /* Cria uma grade responsiva que se adapta ao tamanho da tela */
        .grid-catalogo {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Estilo individual de cada "cartão" de roupa */
        .cartao-roupa {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            text-align: center;
            padding-bottom: 15px;
        }

        .cartao-roupa img {
            width: 100%;
            height: auto; /* A altura se ajusta sozinha à foto */
            display: block; /* Remove espaços vazios indesejados abaixo da imagem */
            border-bottom: 1px solid #eee; /* Opcional: uma linha fina para separar a foto do texto */
        }
        
        .preco {
            color: #27ae60;
            font-weight: bold;
            font-size: 1.2em;
        }

        .tamanho {
            background-color: #333;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 10px;
        }
        /* Estilo do botão do WhatsApp */
        .botao-whatsapp {
            display: block;
            background-color: #25D366; /* Verde oficial do WhatsApp */
            color: white;
            text-decoration: none;
            padding: 10px;
            margin: 15px;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        .botao-whatsapp:hover {
            background-color: #1ebe57; /* Verde um pouco mais escuro ao passar o mouse */
        }
        /* Estilo da barra de filtros */
        .barra-filtros {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            background-color: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            max-width: 1000px;
            margin: 0 auto 30px auto;
        }

        .barra-filtros select, .barra-filtros input[type="range"] {
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .barra-filtros label {
            font-weight: bold;
            color: #333;
        }

        .filtro-preco {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .filtro-preco input[type="range"] {
            width: 200px;
        }

    </style>
</head>

    const containerCatalogo = document.getElementById('catalogo');
    const meuWhatsApp = "5582991588393";

    const inputCategoria = document.getElementById('filtroCategoria');
    const inputPublico = document.getElementById('filtroPublico'); // Capturando o novo select
    const inputPreco = document.getElementById('filtroPreco');
    const displayValorPreco = document.getElementById('valorPreco');

    // 2. Função de Renderizar
    function renderizarCatalogo(listaDeRoupas) {
        containerCatalogo.innerHTML = ""; 

        if (listaDeRoupas.length === 0) {
            containerCatalogo.innerHTML = "<p style='grid-column: 1 / -1; text-align: center; font-size: 1.2em; color: #666;'>Nenhuma peça encontrada com esses filtros.</p>";
            return;
        }

        listaDeRoupas.forEach(roupa => {
            const urlBase = window.location.href;
            const linkFotoCompleto = urlBase + roupa.foto;

            // A mensagem agora inclui se é Masculino, Feminino, etc.
            const mensagem = `Olá! Tenho interesse nesta peça:\n*Produto:* ${roupa.nome}\n*Público:* ${roupa.publico}\n*Tamanho:* ${roupa.tamanho}\n*Preço:* R$ ${roupa.preco}\n*Link:* ${linkFotoCompleto}\n\nAinda está disponível para retirada?`;
            const linkZap = `https://wa.me/${meuWhatsApp}?text=${encodeURIComponent(mensagem)}`;

            const cartao = document.createElement('div');
            cartao.className = 'cartao-roupa';

            cartao.innerHTML = `
                <img src="${roupa.foto}" alt="${roupa.nome}">
                <h3>${roupa.nome}</h3>
                <p class="tamanho">Tam: ${roupa.tamanho} | ${roupa.publico}</p> <!-- Adicionei o público aqui na tela também -->
                <p class="preco">R$ ${roupa.preco}</p>
                <a href="${linkZap}" target="_blank" class="botao-whatsapp">Tenho Interesse</a>
            `;

            containerCatalogo.appendChild(cartao);
        });
    }

        const estoqueFiltrado = estoqueOriginal.filter(roupa => {
            const precoNumero = parseFloat(roupa.preco.replace(',', '.'));
            
            // Regra 1: Passa na Categoria?
            const passaNaCategoria = (categoriaEscolhida === 'todas') || (roupa.categoria === categoriaEscolhida);
            
            // Regra 2: Passa no Público?
            const passaNoPublico = (publicoEscolhido === 'todos') || (roupa.publico === publicoEscolhido);
            
            // Regra 3: Está dentro do preço?
            const passaNoPreco = precoNumero <= precoMaximo;

            // Só retorna VERDADEIRO se passar nas 3 regras ao mesmo tempo!
            return passaNaCategoria && passaNoPublico && passaNoPreco;
        });

        renderizarCatalogo(estoqueFiltrado);
    }

    // 4. "Ouvintes" de Eventos
    inputCategoria.addEventListener('change', aplicarFiltros);
    inputPublico.addEventListener('change', aplicarFiltros); // Ouvindo mudanças no público
    inputPreco.addEventListener('input', aplicarFiltros);

    // 5. Inicia o catálogo
    renderizarCatalogo(estoqueOriginal);
</script>
