<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Roupas</title>
    <style>
        /* CSS: Aqui definimos a aparência da página */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        /* Cria uma grade responsiva que se adapta ao tamanho da tela */
        .grid-catalogo {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Estilo individual de cada "cartão" de roupa */
        .cartao-roupa {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            text-align: center;
            padding-bottom: 15px;
        }

        .cartao-roupa img {
            width: 100%;
            height: auto; /* A altura se ajusta sozinha à foto */
            display: block; /* Remove espaços vazios indesejados abaixo da imagem */
            border-bottom: 1px solid #eee; /* Opcional: uma linha fina para separar a foto do texto */
        }
        

        .preco {
            color: #27ae60;
            font-weight: bold;
            font-size: 1.2em;
        }

        .tamanho {
            background-color: #333;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 10px;
        }
        /* Estilo do botão do WhatsApp */
        .botao-whatsapp {
            display: block;
            background-color: #25D366; /* Verde oficial do WhatsApp */
            color: white;
            text-decoration: none;
            padding: 10px;
            margin: 15px;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        .botao-whatsapp:hover {
            background-color: #1ebe57; /* Verde um pouco mais escuro ao passar o mouse */
        }
    </style>
</head>
<body>

    <h1>Nosso Estoque Disponível</h1>
    
    <!-- HTML: Esta é a "caixa" vazia onde o JavaScript vai injetar as roupas -->
    <div id="catalogo" class="grid-catalogo"></div>

  <script>
    // 1. Dados do seu estoque
    const estoqueDeRoupas = [
        {
            nome: "Chapéu",
            tamanho: "Único",
            preco: "20,00",
            foto: "Imagem/imagem1.jpeg"
        },
        {
            nome: "Body de onça",
            tamanho: "G",
            preco: "20,00",
            foto: "Imagem/Imagem2.jpeg"
        },
        {
            nome: "Vestido Flórido",
            tamanho: "P",
            preco: "25,00",
            foto: "Imagem/imagem3.jpeg"
        },
        {
            nome: "Bota Preta",
            tamanho: "37",
            preco: "25,00",
            foto: "Imagem/imagem4.jpeg"
        }
    ];

    // 2. Configurações e Seleção de Elementos
    const containerCatalogo = document.getElementById('catalogo');
    const meuWhatsApp = "5582991588393"; 

    // 3. Função ÚNICA para renderizar
    function renderizarCatalogo() {
        // Limpa o container antes de renderizar (boa prática)
        containerCatalogo.innerHTML = "";

        estoqueDeRoupas.forEach(roupa => {
            // Cria a mensagem personalizada para o WhatsApp
            const mensagem = `Olá! Tenho interesse na peça: ${roupa.nome} (Tamanho: ${roupa.tamanho}). Gostaria de comprar para ajudar na viagem!`;
            const linkZap = `https://wa.me/${meuWhatsApp}?text=${encodeURIComponent(mensagem)}`;

            // Cria o elemento do cartão
            const cartao = document.createElement('div');
            cartao.className = 'cartao-roupa';

            // Insere o conteúdo, incluindo o botão
            cartao.innerHTML = `
                <img src="${roupa.foto}" alt="${roupa.nome}">
                <h3>${roupa.nome}</h3>
                <p class="tamanho">Tamanho: ${roupa.tamanho}</p>
                <p class="preco">R$ ${roupa.preco}</p>
                <a href="${linkZap}" target="_blank" class="botao-whatsapp">Comprar via WhatsApp</a>
            `;

            // Adiciona o cartão ao container principal
            containerCatalogo.appendChild(cartao);
        });
    }

    // 4. Chamada da função para executar o código
    renderizarCatalogo();
</script>
</body>
</html>
